version: "1"

# Pod name. Used for container naming and default log mount `/var/log/${pod-name}`.
name: demo-service

# Default operating mode when `--mode` is not passed on the CLI: "run" or "dev".
mode: run

# Base image resolved from the `base-images` branch catalog by default.
base:
  name: ubuntu24-py312
  tag: latest
  # Optional overrides for retrieving the base-images catalog:
  repo_url: "git@github.com:bobozi-cmd/pokeymans.git"
  branch: "base-images"
  # Optional escape hatch: bypass catalog lookup and use a raw Docker image ref directly.
  raw_image: null

# Default log persistence mount (enabled by default).
# `${pod-name}` is automatically expanded to `name` above (e.g. `/var/log/demo-service`).
logging:
  enabled: true
  host_dir: "/var/log/${pod-name}"
  container_dir: "/var/log/${pod-name}"

# Shared container resources (optional).
resources:
  gpus: null          # e.g. "all" or "0,1"
  shm_size: "2g"
  network_mode: null  # e.g. "host" or "bridge"

# Mode 1: Run Mode configuration.
run:
  # Provisioning strategy:
  #   - "runtime": Scheme B (default) - inject apt/pip/env/entrypoint at container startup.
  #   - "build":   Scheme A (reserved) - build a derived Docker image from base + layers.
  strategy: runtime

  apt:
    - curl
    - vim
  apt_mirror: null

  pip:
    - fastapi>=0.115
    - uvicorn
  requirements_file: null
  pip_index_url: null

  env_file: null
  env:
    APP_ENV: production
    LOG_LEVEL: info

  workdir: /app
  entrypoint: "bash /app/scripts/start.sh"

  # When true, the container starts with full apt/pip/env ready, but skips `entrypoint`.
  debug: false

  ports:
    - "8000:8000"
  mounts:
    - "./:/app"

  # Optional host cache directory used by Scheme B runtime bootstrap to speed up apt/pip installs.
  cache_dir: null

# Mode 2: Dev Mode configuration (VS Code Dev Container).
# No service entrypoint or apt/pip restrictions; users configure freely inside the container.
dev:
  workspace_host: "."
  workspace_container: "/workspace"
  persist_home: true
  remote_user: null
  ports:
    - "8000:8000"
  mounts: []
  vscode_extensions:
    - ms-python.python
    - ms-python.vscode-pylance
