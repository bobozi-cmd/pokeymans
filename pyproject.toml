[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pokeymans"
dynamic = ["version"]
description = "Lightweight pod environment builder supporting Run Mode (runtime bootstrap / image build) and VS Code Dev Container Mode."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6.0",
]

[project.scripts]
pokey = "pokeymans.cli.main:main"
pokeymans = "pokeymans.cli.main:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pokeymans = ["templates/*"]
