version: "1"

# Pod name. Used for container naming and default log mount `/var/log/${pod-name}`.
name: demo-service

# Default operating mode when `--mode` is not passed on the CLI: "run" or "dev".
mode: run

# Base image resolved from the `base-images` branch catalog by default.
# Available official images include `ubuntu24-py312` (CPU + py-spy) and
# `ubuntu24-cuda12-py312` (GPU + CUDA 12.6 + nsys + ncu + py-spy).
base:
  name: ubuntu24-py312
  tag: latest
  repo_url: "git@github.com:bobozi-cmd/pokeymans.git"
  branch: "base-images"
  raw_image: null

# Default log persistence mount (enabled by default).
# `${pod-name}` is automatically expanded to `name` above (e.g. `/var/log/demo-service`).
logging:
  enabled: true
  host_dir: "~/.local/state/pokeymans/logs/${pod-name}"
  container_dir: "/var/log/${pod-name}"

# Shared container resources (optional).
resources:
  gpus: null          # e.g. "all" or "0,1"
  shm_size: "2g"
  network_mode: null  # e.g. "host" or "bridge"

# Observability & profiling capabilities (enabled by default for both Run and Dev modes).
# Run `pokey doctor` on the host to verify sysctl and NVIDIA ncu profiling permissions.
perf:
  enabled: true             # Injects SYS_PTRACE, PERFMON, and seccomp=unconfined
  gpu_profiling: auto       # auto: adds SYS_ADMIN + NVIDIA_DRIVER_CAPABILITIES=all when resources.gpus is set
  mount_host_perf: false    # Opt-in: bind-mount host `perf` binary into /usr/local/bin/perf
  pid_host: false           # Opt-in: share host PID namespace
  profile_subdir: profiles  # Creates /var/log/${pod-name}/profiles (exposed as $POKEY_PROFILE_DIR)

# Mode 1: Run Mode configuration.
run:
  strategy: runtime
  apt:
    - curl
    - vim
  apt_mirror: null
  pip:
    - fastapi>=0.115
    - uvicorn
  requirements_file: null
  pip_index_url: null
  env_file: null
  env:
    APP_ENV: production
    LOG_LEVEL: info
  workdir: /app
  entrypoint: "bash /app/scripts/start.sh"
  debug: false
  ports:
    - "8000:8000"
  mounts:
    - "./:/app"
  cache_dir: null

# Mode 2: Dev Mode configuration (VS Code Dev Container).
dev:
  workspace_host: "."
  workspace_container: "/workspace"
  persist_home: true
  remote_user: null
  ports:
    - "8000:8000"
  mounts: []
  vscode_extensions:
    - ms-python.python
    - ms-python.vscode-pylance
