name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with full git history & tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build and test dependencies
        run: python -m pip install --upgrade pip build setuptools wheel PyYAML

      - name: Run unit tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v

      - name: Build wheel and sdist
        run: python -m build --no-isolation

      - name: Smoke-test built wheel
        run: |
          python -m venv /tmp/smoke-venv
          /tmp/smoke-venv/bin/pip install --no-deps dist/pokeymans-*.whl
          /tmp/smoke-venv/bin/pip install PyYAML
          /tmp/smoke-venv/bin/pokey --version
          /tmp/smoke-venv/bin/pokey --help > /dev/null

      - name: Generate SHA256 checksums
        run: (cd dist && sha256sum * > SHA256SUMS.txt)

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          PRERELEASE_FLAG=""
          if [[ "${TAG}" =~ (a|b|rc)[0-9]+$ || "${TAG}" == *-* ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          gh release create "${TAG}" dist/* \
            --title "${TAG}" \
            --generate-notes \
            ${PRERELEASE_FLAG}
